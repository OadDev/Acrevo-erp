name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_mysql, gd, zip, exif, curl, intl
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install and build frontend assets
        run: |
          npm ci
          npm run build

      - name: Install sshpass
        run: sudo apt-get update -y && sudo apt-get install -y sshpass

      - name: Sync application to Hostinger
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
        run: |
          sshpass -e rsync -az --delete \
            -e "ssh -p ${{ secrets.HOSTINGER_SSH_PORT }} -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env' \
            --exclude='storage' \
            --exclude='public/storage' \
            ./ "${{ secrets.HOSTINGER_SSH_USERNAME }}@${{ secrets.HOSTINGER_SSH_HOST }}:${{ secrets.HOSTINGER_DEPLOY_PATH }}/"

      - name: Run post-deploy commands on server
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ secrets.HOSTINGER_SSH_PORT }} -o StrictHostKeyChecking=no \
            "${{ secrets.HOSTINGER_SSH_USERNAME }}@${{ secrets.HOSTINGER_SSH_HOST }}" \
            "cd '${{ secrets.HOSTINGER_DEPLOY_PATH }}' && \
             PHP_BIN=\$(command -v php8.5 || echo /opt/alt/php85/usr/bin/php) && \
             [ -x \"\$PHP_BIN\" ] || PHP_BIN=\$(command -v php8.4 || echo /opt/alt/php84/usr/bin/php) && \
             [ -x \"\$PHP_BIN\" ] || PHP_BIN=\$(command -v php8.3 || echo /opt/alt/php83/usr/bin/php) && \
             [ -x \"\$PHP_BIN\" ] || PHP_BIN=\$(command -v php8.2 || echo /opt/alt/php82/usr/bin/php) && \
             [ -x \"\$PHP_BIN\" ] || PHP_BIN=php && \
             echo \"Using PHP binary: \$PHP_BIN (\$(\$PHP_BIN -v | head -1))\" && \
             mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/public bootstrap/cache && \
             \$PHP_BIN artisan storage:link --force && \
             \$PHP_BIN artisan migrate --force && \
             \$PHP_BIN artisan optimize:clear && \
             \$PHP_BIN artisan config:cache && \
             \$PHP_BIN artisan route:cache && \
             \$PHP_BIN artisan view:cache"

      - name: Print install link (only if not yet installed)
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ secrets.HOSTINGER_SSH_PORT }} -o StrictHostKeyChecking=no \
            "${{ secrets.HOSTINGER_SSH_USERNAME }}@${{ secrets.HOSTINGER_SSH_HOST }}" \
            "cd '${{ secrets.HOSTINGER_DEPLOY_PATH }}' && \
             if [ -f storage/installed ]; then \
               echo 'Already installed - visit https://geethanworks.in to use the app.'; \
             elif [ -f storage/install_token.txt ]; then \
               echo \"Open this link to finish setup: https://geethanworks.in/install?token=\$(cat storage/install_token.txt)\"; \
             else \
               echo 'No install token found yet - the installer route has not been hit yet, or storage/ was reset.'; \
             fi"

      - name: One-off diagnostic - check deleted user vs executive team leader state (remove after use)
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ secrets.HOSTINGER_SSH_PORT }} -o StrictHostKeyChecking=no \
            "${{ secrets.HOSTINGER_SSH_USERNAME }}@${{ secrets.HOSTINGER_SSH_HOST }}" \
            "cd '${{ secrets.HOSTINGER_DEPLOY_PATH }}' && \
             PHP_BIN=\$(command -v php8.5 || echo /opt/alt/php85/usr/bin/php) && \
             [ -x \"\$PHP_BIN\" ] || PHP_BIN=\$(command -v php8.4 || echo /opt/alt/php84/usr/bin/php) && \
             [ -x \"\$PHP_BIN\" ] || PHP_BIN=php && \
             echo '' | base64 -d > /tmp/check_leader.php && \
             \$PHP_BIN artisan tinker --execute=\"require '/tmp/check_leader.php';\" && \
             rm -f /tmp/check_leader.php"
